# PostgreSQL. Versions 9.3 and up are supported.
default: &default
  adapter: postgresql
  encoding: unicode
  # Pool should match RAILS_MAX_THREADS (5 by default)
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Solid Cache, Solid Queue and Solid Cable share the primary database in every
# environment rather than owning one each. They therefore carry
# `schema_dump: false`: their tables already live in db/schema.rb, and letting
# them dump or load a schema file of their own means each load recreates the
# primary's tables from that file's copy of them. The stale
# db/{cache,queue,cable}_schema.rb dumps this produces rebuild the application
# tables on every test run, and would drop them outright if ever loaded against
# a live database.

development:
  primary:
    <<: *default
    database: skeleton_development
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  cache:
    <<: *default
    database: skeleton_development
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
    migrations_paths: db/cache_migrate
    schema_dump: false
  queue:
    <<: *default
    database: skeleton_development
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
    migrations_paths: db/queue_migrate
    schema_dump: false
  cable:
    <<: *default
    database: skeleton_development
    host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
    password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
    migrations_paths: db/cable_migrate
    schema_dump: false

